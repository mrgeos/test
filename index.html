<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEOGLYF · Брендинг и айдентика</title>
<meta name="description" content="Портфолио по брендингу и айдентике: брендбуки, логотипы, упаковка.">
<meta property="og:title" content="GEOGLYF · Брендинг и айдентика">
<meta property="og:description" content="Брендбуки, логотипы и упаковка. Можно пролистать прямо на сайте.">
<meta property="og:image" content="img/bonami/cover.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="img/bonami/cover.jpg">
<style>
:root{
  --bg:#f3f3f1; --surface:#e9e9e6; --fg:#151515; --muted:#686866; --line:rgba(21,21,21,.12);
  --radius:4px; --gutter:clamp(16px,3vw,40px); --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#121212; --surface:#1c1c1b; --fg:#ececea; --muted:#9a9a97; --line:rgba(236,236,234,.12); color-scheme:dark; }
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:400 16px/1.55 Onest,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
img{display:block;max-width:100%;height:auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:var(--radius)}
.wrap{max-width:1440px;margin:0 auto;padding:0 var(--gutter)}

/* nav */
.nav{height:68px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:600;letter-spacing:.04em;text-decoration:none}
.nav ul{display:flex;gap:28px;list-style:none}
.nav ul a{text-decoration:none;color:var(--muted);transition:color .2s}
.nav ul a:hover{color:var(--fg)}

/* intro */
.intro{padding:clamp(48px,9vw,112px) 0 clamp(40px,6vw,80px);display:grid;gap:20px}
.intro h1{font-weight:500;font-size:clamp(40px,7vw,96px);line-height:1;letter-spacing:-.035em;max-width:12ch}
.intro p{color:var(--muted);font-size:clamp(17px,1.4vw,20px);max-width:46ch}

/* grid */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(28px,3vw,48px) clamp(16px,2vw,28px)}
.card{grid-column:span 12;text-decoration:none;display:grid;align-content:start;gap:14px;opacity:0;transform:translateY(16px);animation:rise .9s var(--ease) forwards;animation-delay:calc(var(--i)*80ms)}
.card .media{overflow:hidden;border-radius:var(--radius);background:var(--surface);aspect-ratio:var(--ar,4/3);box-shadow:0 0 0 1px var(--line)}
.card img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease)}
.card:hover img{transform:scale(1.025)}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;align-items:baseline}
.meta h2{white-space:nowrap}
.meta h2{font-size:19px;font-weight:500;letter-spacing:-.01em}
.meta span{color:var(--muted);font-size:14px;white-space:nowrap}
.card p{color:var(--muted);font-size:15px;max-width:52ch;margin-top:-8px}
@media (min-width:768px){
  .c-bonami{grid-column:1/span 7}
  .c-karlson{grid-column:8/span 5;align-self:end}
  .c-berberry{grid-column:1/span 5}
  .c-uchoose{grid-column:6/span 7;align-self:end}
  .c-karo{grid-column:6/span 7}
}
@keyframes rise{to{opacity:1;transform:none}}

/* contacts */
.contact{margin-top:clamp(96px,12vw,176px);padding:clamp(40px,5vw,64px) 0;border-top:1px solid var(--line);display:grid;gap:28px}
.contact h2{font-weight:500;font-size:clamp(32px,4.5vw,60px);line-height:1.05;letter-spacing:-.03em}
.links{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;height:48px;padding:0 22px;border-radius:var(--radius);border:1px solid var(--line);text-decoration:none;white-space:nowrap;transition:background .2s,border-color .2s,transform .15s}
.btn:hover{border-color:var(--fg)}
.btn:active{transform:scale(.98)}
.btn.solid{background:var(--fg);color:var(--bg);border-color:var(--fg)}
footer{padding:24px 0 40px;color:var(--muted);font-size:14px}

/* viewer */
dialog.viewer{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;border:0;background:var(--bg);color:var(--fg);overflow-y:auto;overscroll-behavior:contain}
dialog.viewer[open]{animation:fade .35s var(--ease)}
dialog.viewer::backdrop{background:var(--bg)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.bar{position:sticky;top:0;z-index:2;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar .wrap{height:64px;display:flex;align-items:center;gap:20px}
.bar .t{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .t small{color:var(--muted);font-weight:400;font-size:15px;margin-left:10px}
.count{color:var(--muted);font-variant-numeric:tabular-nums;font-size:15px}
.close{height:40px;padding:0 16px;border:1px solid var(--line);border-radius:var(--radius)}
.close:hover{border-color:var(--fg)}
.pages{max-width:1560px;margin:0 auto;padding:clamp(16px,2.5vw,32px) var(--gutter) 0;display:grid;gap:clamp(10px,1.4vw,20px)}
.pages:focus{outline:none}
.pages img{width:100%;border-radius:var(--radius);background:var(--surface)}
.next{max-width:1560px;margin:0 auto;padding:clamp(48px,7vw,96px) var(--gutter) clamp(64px,8vw,120px);display:grid;gap:18px}
.next span{color:var(--muted)}
.next button{justify-self:start;text-align:left;font-size:clamp(28px,4vw,52px);font-weight:500;letter-spacing:-.03em;line-height:1.1}
.next button:hover{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px}
html.lock{overflow:hidden}

@media (max-width:767px){
  .nav ul{gap:18px}
  .bar .t small,.count-total{display:none}
}
@media (prefers-reduced-motion:reduce){
  .card{animation:none;opacity:1;transform:none}
  .card img,dialog.viewer[open]{transition:none;animation:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="nav">
    <a class="logo" href="./">GEOGLYF</a>
    <ul><li><a href="#work">Проекты</a></li><li><a href="#contact">Контакты</a></li></ul>
  </header>

  <section class="intro">
    <h1>Брендинг и айдентика</h1>
    <p>Логотипы, фирменные стили и упаковка. Брендбуки можно пролистать целиком прямо здесь.</p>
  </section>

  <main id="work" class="grid" aria-label="Проекты"></main>

  <section id="contact" class="contact">
    <h2>Обсудим ваш бренд?</h2>
    <div class="links">
      <a class="btn solid" href="mailto:hi@geoglyf.com">hi@geoglyf.com</a>
      <a class="btn" href="https://geoglyf.com" target="_blank" rel="noopener">geoglyf.com</a>
    </div>
  </section>

  <footer>© GEOGLYF, Георгий Шустов</footer>
</div>

<dialog class="viewer" id="viewer" aria-labelledby="vt">
  <div class="bar"><div class="wrap">
    <div class="t" id="vt"></div>
    <div class="count" aria-live="polite"><span id="vc">1</span><span class="count-total"> / <span id="vn"></span></span></div>
    <button class="close" id="vx" type="button">Закрыть</button>
  </div></div>
  <div class="pages" id="vp" tabindex="-1" autofocus></div>
  <div class="next"><span>Следующий проект</span><button type="button" id="vnext"></button></div>
</dialog>

<script>
/* Чтобы добавить проект: положите страницы в img/<slug>/p-01.jpg, p-02.jpg ... и cover.jpg, затем допишите объект ниже. */
const PROJECTS = [
  { slug:"bonami",   title:"Bonami 2.0",        client:"Пекарня-кондитерская, Якутск", tag:"Упаковка, паттерн",      year:"2026", pages:29, w:2000, h:1231,
    text:"Обновление упаковки: французская пекарня с якутскими корнями.", sizes:{3:1451,25:1276,27:1386} },
  { slug:"karlson",  title:"Karlson Family",    client:"Мебельное производство",       tag:"Логотип, фирменный стиль", year:"2025", pages:30, w:2000, h:1415,
    text:"Зонтичный бренд: знак, шрифтовая часть, конструкция и правила стиля." },
  { slug:"berberry", title:"Berberry & Ptichka", client:"Дуплекс-кафе",                tag:"Фирменный стиль",          year:"",     pages:19, w:2000, h:1415,
    text:"Знак-амперсанд в образе птицы, цвета, шрифты и паттерны." },
  { slug:"uchoose",  title:"Ючуз рестайл",      client:"Сеть кинотеатров КАРО",        tag:"Упаковка, концепт",        year:"2025", pages:15, w:2000, h:1125,
    text:"Концепт «Арт-вандал» для линейки стаканов с попкорном." },
  { slug:"karo",     title:"КАРО",              client:"Сеть кинотеатров",             tag:"Гайдлайн логотипа",        year:"2022", pages:20, w:2000, h:1415,
    text:"Ресурсы бренда: логотип, дескриптор, охранное поле, шрифты." }
];

const pad = n => String(n).padStart(2,"0");
const grid = document.getElementById("work");
grid.innerHTML = PROJECTS.map((p,i) => `
  <a class="card c-${p.slug}" style="--i:${i};--ar:${p.w}/${p.h}" href="#${p.slug}" data-slug="${p.slug}">
    <div class="media"><img src="img/${p.slug}/cover.jpg" alt="${p.title}, обложка брендбука" ${i<2?'fetchpriority="high"':'loading="lazy"'} decoding="async" width="1400" height="${Math.round(1400*p.h/p.w)}"></div>
    <div class="meta"><h2>${p.title}</h2><span>${[p.tag,p.year].filter(Boolean).join(", ")}</span></div>
    <p>${p.client}. ${p.text}</p>
  </a>`).join("");

const dlg = document.getElementById("viewer"), vp = document.getElementById("vp"),
      vt = document.getElementById("vt"), vc = document.getElementById("vc"),
      vn = document.getElementById("vn"), vnext = document.getElementById("vnext");
let current = null, io = null, imgs = [];

function open(slug, page){
  const p = PROJECTS.find(x => x.slug === slug); if(!p) return;
  current = p;
  vt.innerHTML = `${p.title}<small>${p.client}</small>`;
  vn.textContent = p.pages; vc.textContent = 1;
  vp.innerHTML = Array.from({length:p.pages}, (_,k) => {
    const n = k+1, h = (p.sizes && p.sizes[n]) || p.h;
    return `<img src="img/${p.slug}/p-${pad(n)}.jpg" alt="${p.title}, страница ${n}" width="${p.w}" height="${h}" ${n>2?'loading="lazy"':''} decoding="async" data-n="${n}">`;
  }).join("");
  const nx = PROJECTS[(PROJECTS.indexOf(p)+1) % PROJECTS.length];
  vnext.textContent = nx.title + " →"; vnext.dataset.slug = nx.slug;
  imgs = [...vp.querySelectorAll("img")];
  if(!dlg.open){ dlg.showModal(); document.documentElement.classList.add("lock"); }
  dlg.scrollTop = 0;
  if(page > 1 && imgs[page-1]) requestAnimationFrame(() => imgs[page-1].scrollIntoView());
  io && io.disconnect();
  io = new IntersectionObserver(() => { vc.textContent = currentPage(); },
    { root:dlg, threshold:[0,.25,.5,.75,1] });
  imgs.forEach(i => io.observe(i));
  if(location.hash !== "#"+slug) history.pushState(null,"","#"+slug);
}
function close(){ dlg.close(); }
dlg.addEventListener("close", () => {
  document.documentElement.classList.remove("lock");
  io && io.disconnect(); vp.innerHTML = ""; current = null;
  if(location.hash) history.replaceState(null,"",location.pathname + location.search);
});

grid.addEventListener("click", e => {
  const a = e.target.closest(".card"); if(!a || e.metaKey || e.ctrlKey) return;
  e.preventDefault(); open(a.dataset.slug, 1);
});
document.getElementById("vx").onclick = close;
vnext.onclick = () => open(vnext.dataset.slug, 1);

function currentPage(){
  const line = innerHeight * 0.4; let n = 1;
  for(const im of imgs){ if(im.getBoundingClientRect().top < line) n = +im.dataset.n; else break; }
  return n;
}
let target = null, tt;
function step(d){
  const n = Math.min(imgs.length, Math.max(1, (target ?? currentPage()) + d));
  target = n; clearTimeout(tt); tt = setTimeout(() => target = null, 700);
  imgs[n-1].scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
}
dlg.addEventListener("keydown", e => {
  if(["ArrowRight","ArrowDown","PageDown","j"].includes(e.key) && !e.shiftKey){ e.preventDefault(); step(1); }
  if(["ArrowLeft","ArrowUp","PageUp","k"].includes(e.key)){ e.preventDefault(); step(-1); }
});

function route(){
  const slug = location.hash.slice(1);
  if(PROJECTS.some(p => p.slug === slug)){ if(!current || current.slug !== slug) open(slug,1); }
  else if(dlg.open) dlg.close();
}
window.addEventListener("popstate", route);
route();
</script>
</body>
</html>
